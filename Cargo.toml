[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/adapters/cloudroom",
    "crates/adapters/github",
    "crates/cli",
    "tests",
]

[workspace.package]
version = "0.0.1-dev"
edition = "2024"
rust-version = "1.99.1"
publish = false

# The only approved third-party crates. Anything else needs Jake's yes.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "=1.1.6", default-features = false, features = ["fs", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# K7 (#427): the in-house SHA-256 and the staging loops, optimised in dev
# and test builds; debug assertions and overflow checks stay on.
[profile.dev.package.openwiz-core]
opt-level = 3

[profile.dev.package."*"]
opt-level = 1
